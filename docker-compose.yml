services:
    app:
        restart: always
        build: .
        command: "gunicorn -b 0.0.0.0:5000 metadome.application:app"
        environment:
            - FLASK_APP=metadome/application.py
            - MAIL_SERVER=mailserver
            - MAIL_PORT=25
            - CACHE_TYPE=RedisCache
            - CACHE_REDIS_URL=redis://redis:6379/1
        env_file:
           - metadome/database.env
           - metadome/mailserver.env
        ports:
            - "5000:5000"
        depends_on:
            db:
              condition: service_healthy
            redis:
              condition: service_healthy
            rabbitmq:
              condition: service_healthy
            mailserver:
              condition: service_started
        volumes:
            - ${PWD}:/usr/src/app
            - data:/usr/data
            - clinvar:/usr/data/ClinVar
            - gnomad:/usr/data/gnomAD
    celery:
        restart: always
        build:
            context: .
            dockerfile: Dockerfile
        command: celery -A metadome.application:celery worker --loglevel=info
        environment:
            - C_FORCE_ROOT=1
            - CACHE_TYPE=RedisCache
            - CACHE_REDIS_URL=redis://redis:6379/1
        env_file:
           - metadome/database.env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        volumes:
            - ${PWD}:/usr/src/app
            - data:/usr/data
            - clinvar:/usr/data/ClinVar
            - gnomad:/usr/data/gnomAD
    db:
        restart: always
        image: postgres:18.0
        platform: linux/arm64
        env_file:
           - metadome/database.env
        ports:
            - "5432:5432"
        volumes:
            - metadome_postgres_db:/var/lib/postgresql
        healthcheck:
             test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
             interval: 30s
             timeout: 30s
             retries: 5
             start_period: 10s
    redis:
        restart: always
        image: redis:8.2.3
        platform: linux/arm64
        ports:
          - "6379:6379"
        healthcheck:
          test: [ "CMD", "redis-cli", "ping" ]
          interval: 10s
          timeout: 5s
          retries: 10
    rabbitmq:
        restart: always
        image: rabbitmq:4.2.0
        platform: linux/arm64
        volumes:
          - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
        depends_on:
            - db
        ports:
          - "15672:15672"
        healthcheck:
          test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
          interval: 10s
          timeout: 10s
          retries: 12
    mailserver:
        image:  boky/postfix:4.4.0
        restart: always
        env_file:
           - metadome/mailserver.env
volumes:
   data:
      driver_opts:
        type: none
        device: ${METADOME_DIR}
        o: bind
      driver: local
   clinvar:
      driver_opts:
        type: none
        device: ${CLINVAR_DIR}
        o: bind
      driver: local
   gnomad:
      driver_opts:
        type: none
        device: ${GNOMAD_DIR}
        o: bind
      driver: local
   metadome_postgres_db:
      driver_opts:
        type: none
        device: ${METADOME_POSTGRES_DB_DIR}
        o: bind
      driver: local
