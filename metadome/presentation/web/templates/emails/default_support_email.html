<div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
    <div style="background-color: #3498db; padding: 20px; text-align: center;">
        <h1 style="color: white; margin: 0;">MetaDome Support</h1>
    </div>
    
    <div style="padding: 30px; background-color: #f8f9fa;">
        <h2 style="color: #2c3e50;">Thank you for contacting us!</h2>
        
        <p style="color: #555; line-height: 1.6;">
            We have received your support request.
        </p>
        
        <div style="background-color: white; padding: 20px; border-radius: 5px; margin: 20px 0;">
            <h3 style="color: #2c3e50; margin-top: 0;">Your message:</h3>
            <p style="color: #666; white-space: pre-wrap;">{{ body }}</p>
        </div>

        <p style="color: #555; line-height: 1.6;">
            If you have additional information to add, simply reply to this email.
        </p>

        <hr style="border: none; border-top: 1px solid #ddd; margin: 30px 0;">

        <p style="color: #999; font-size: 12px; text-align: center;">
            <img src="{{ logo_url }}" alt="MetaDome" style="height: 30px; vertical-align: middle; margin-right: 10px;">
            MetaDome - <a href="https://metadome.app" style="color: #3498db;">https://metadome.app</a>
        </p>
    </div>
</div>
